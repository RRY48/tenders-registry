<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Реестр тендеров</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E4003A;--black:#3C3C3B;--blue:#169FDB;--green:#00A984;--yellow:#FBBB21;--purple:#9373B1;--pink:#F39DB1;--gray:#DADADA;--bg:#FAFAFA;--card:#FFFFFF;--border:#ECECEC}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--black);padding:16px}
.wrap{max-width:1800px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{color:var(--red);font-size:22px;font-weight:800;letter-spacing:1px;margin:0}
.logo{height:84px;width:auto}
.sub{color:#999;font-size:13px;margin-bottom:12px}
.toolbar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.toolbar input[type=text]{padding:7px 12px;border:1px solid var(--border);border-radius:8px;flex:1;min-width:180px;font-family:inherit;font-size:13px}
.toolbar select{padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px}
.btn{padding:7px 14px;border:0;border-radius:8px;background:var(--red);color:#fff;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}.btn.gray{background:#B5B5B5}.btn.blue{background:var(--blue)}
.count{font-size:13px;color:#999;margin-left:auto}
.form{display:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.form.open{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
label{font-size:11px;color:#999;display:block;font-weight:500}
input,select,textarea{width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit}
textarea{min-height:50px}
.actions{margin-top:10px;display:flex;gap:8px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
th{background:var(--red);color:#fff;text-align:left;padding:8px;position:sticky;top:0;cursor:pointer;white-space:nowrap;font-weight:600}
td{padding:6px 8px;border-bottom:1px solid #F5F5F5;vertical-align:top}
#tab tr.alt td{background:#DADADA}
#tab tr:hover td{background:#FFF5F7}
.clamp4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;max-width:320px}
.soon{color:var(--red);font-weight:700}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:500}
.tag.gray{background:#F0F0F0;color:#777}.tag.green{background:#E6F7F2;color:var(--green)}
.tag.red{background:#FDE8EE;color:var(--red)}.tag.or{background:#FFF8E1;color:#F0A500}
.stats{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;flex:1;min-width:140px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.stat .n{font-size:22px;font-weight:800;color:var(--red)}
.stat .l{font-size:12px;color:#999}
.empty{padding:30px;text-align:center;color:#B5B5B5;font-weight:500}
/* Контекстное меню у курсора */
#ctx{display:none;position:fixed;z-index:1000;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:5px;min-width:160px}
#ctx button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer;font-family:inherit;font-size:13px;color:var(--black);border-radius:6px}
#ctx button:hover{background:#FFF5F7;color:var(--red)}
#ctx .sep{border-top:1px solid var(--border);margin:4px 0}
/* Кнопка наверх */
#toTop{display:none;position:fixed;bottom:24px;right:24px;z-index:999;width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;border:0;cursor:pointer;font-size:20px;font-family:inherit;font-weight:800;box-shadow:0 4px 12px rgba(228,0,58,.35);transition:opacity .2s}
#toTop:hover{opacity:.85}
</style>
</head>
<body>
<div class="wrap">
<div class="head">
<h1>Реестр тендеров</h1>
<img src="ino-mini.png" class="logo" alt="Иностудио">
</div>
<div class="stats" id="stats"></div>
<div class="toolbar">
  <input type="text" id="q" placeholder="Поиск: название, заказчик, ссылка…" oninput="render()">
  <select id="fDate" onchange="render()"><option value="">Все месяцы</option></select>
  <select id="fLay" onchange="render()"><option value="">Все площадки</option></select>
  <select id="fSub" onchange="render()"><option value="">Подача: все</option><option value="да">да</option><option value="нет">нет</option><option value="не ясно">не ясно</option></select>
  <select id="fSus" onchange="render()"><option value="">Подозрительные: все</option><option value="да">да</option><option value="нет">нет</option></select>
  <button class="btn green" onclick="tgl()">+ Быстрый ввод</button>
  <button class="btn gray" onclick="exp()">Экспорт</button>
  <label class="btn gray" style="cursor:pointer">Импорт<input type="file" id="fimp" accept=".json" style="display:none" onchange="imp(event)"></label>
  <span class="count" id="cnt"></span>
</div>
<div class="form" id="form">
  <div class="grid">
    <div><label>Дата</label><input id="nDate" type="date" onchange="setDateLabel()"><input type="text" id="nDateLbl" readonly style="background:#F8F8F8;margin-top:2px"></div>
    <div><label>№ лида</label><input id="nLead"></div>
    <div><label>Название *</label><input id="nName"></div>
    <div><label>Заказчик</label><input id="nCust"></div>
    <div><label>Регион</label><input id="nReg"></div>
    <div><label>Закон / площадка</label><input id="nLaw"></div>
    <div><label>Тип процедуры</label><input id="nType"></div>
    <div><label>Дата завершения приема заявок</label><input id="nDl" type="date"></div>
    <div><label>НМЦ (руб)</label><input id="nNmt"></div>
    <div><label>Обеспечение заявки (₽)</label><input id="nSecBid"></div>
    <div><label>Обеспечение процедуры (₽)</label><input id="nSecContr"></div>
    <div><label>Наша начальная ставка (₽)</label><input id="nStartBid"></div>
    <div><label>Наша конечная ставка (₽)</label><input id="nFinalBid"></div>
    <div><label>% влияния цены решение</label><input id="nPricePercent"></div>
    <div><label>Подались да/нет</label><select id="nSub"><option value="">-</option><option value="да">да</option><option value="нет">нет</option><option value="не ясно">не ясно</option></select></div>
    <div><label>Подозрительный да/нет</label><select id="nSus"><option value="">-</option><option value="да">да</option><option value="нет">нет</option></select></div>
    <div><label>Основные технологии</label><input id="nTech"></div>
    <div><label>Срок реализации</label><input id="nTerm"></div>
    <div><label>Типы причины неучастия</label><input id="nReasonType"></div>
    <div><label>Описание причины несоответствия</label><input id="nReasonDesc"></div>
    <div><label>Делали концепцию</label><select id="nConcept"><option value="">-</option><option value="да">да</option><option value="нет">нет</option></select></div>
    <div><label>Задавали вопросы</label><select id="nQAsked"><option value="">-</option><option value="да">да</option><option value="нет">нет</option></select></div>
    <div><label>Получили ответы</label><select id="nQAns"><option value="">-</option><option value="да">да</option><option value="нет">нет</option></select></div>
    <div><label>Общение только через площадку</label><select id="nOnlyPlatform"><option value="">-</option><option value="да">да</option><option value="нет">нет</option></select></div>
    <div><label>Общение email / телефону</label><select id="nEmailPhone"><option value="">-</option><option value="да">да</option><option value="нет">нет</option></select></div>
    <div><label>Делалась ли оценка</label><select id="nEval"><option value="">-</option><option value="командная">командная</option><option value="грубая">грубая</option><option value="нет">нет</option></select></div>
    <div><label>Контактные данные</label><input id="nContact"></div>
    <div><label>Критерии влияния с %</label><input id="nCriteria"></div>
    <div><label>Ссылка</label><input id="nHref"></div>
    <div><label>Комметарии</label><textarea id="nComm"></textarea></div>
    <div><label>Итоги (промежуточные и финальные)</label><textarea id="nHist"></textarea></div>
  </div>
  <div class="actions"><button class="btn green" onclick="add()" id="btnAdd">Добавить</button><button class="btn blue" onclick="upd()" id="btnUpd" style="display:none">Сохранить изменения</button><button class="btn gray" onclick="tgl()">Отмена</button></div>
</div>
<table id="tab"></table>
<div class="empty" id="emp">Загрузка…</div>
</div>
<div id="ctx">
  <button onclick="ctxEdit()">✎ &nbsp;Редактировать</button>
  <button onclick="ctxDel()">✕ &nbsp;Удалить</button>
</div>
<button id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Наверх">↑</button>
<script>
var data=[], KEY='tenders2026_web', DATA_VER='2026.7', editId=null, ctxId=null;
var FIELDS=['№ лида','Ссылка','Название','Заказчик','Регион','Закон / площадка','Тип процедуры','Дата завершения приема заявок','НМЦ','Обеспечение заявки','Обеспечение процедуры','Наша начальная ставка','Наша конечная ставка','% влияния цены решение','Подались да/нет (нет)','Подозрительный да/нет (нет)','Основные технологии','Срок реализации','Типы причины неучастия в тендере','Описание причины несоответствия нас и тендера','Делали концепцию или нет','Задавали вопросы или нет','Получили ответы на вопросы или нет','Общение только через площадку','Общение по email / телефону','Делалась ли оценка (командой / грубая)','Контактные данные','Критерии влияния на решение с %','Комметарии','Итоги (промежуточные и финальные)'];
var F2I={'№ лида':'nLead','Ссылка':'nHref','Название':'nName','Заказчик':'nCust','Регион':'nReg','Закон / площадка':'nLaw','Тип процедуры':'nType','Дата завершения приема заявок':'nDl','НМЦ':'nNmt','Обеспечение заявки':'nSecBid','Обеспечение процедуры':'nSecContr','Наша начальная ставка':'nStartBid','Наша конечная ставка':'nFinalBid','% влияния цены решение':'nPricePercent','Подались да/нет (нет)':'nSub','Подозрительный да/нет (нет)':'nSus','Основные технологии':'nTech','Срок реализации':'nTerm','Типы причины неучастия в тендере':'nReasonType','Описание причины несоответствия нас и тендера':'nReasonDesc','Делали концепцию или нет':'nConcept','Задавали вопросы или нет':'nQAsked','Получили ответы на вопросы или нет':'nQAns','Общение только через площадку':'nOnlyPlatform','Общение по email / телефону':'nEmailPhone','Делалась ли оценка (командой / грубая)':'nEval','Контактные данные':'nContact','Критерии влияния на решение с %':'nCriteria','Комметарии':'nComm','Итоги (промежуточные и финальные)':'nHist'};
var SEL_FIELDS=['Подались да/нет (нет)','Подозрительный да/нет (нет)','Делали концепцию или нет','Задавали вопросы или нет','Получили ответы на вопросы или нет','Общение только через площадку','Общение по email / телефону','Делалась ли оценка (командой / грубая)'];
fetch('data.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(x){init(x)}).catch(function(){var s=localStorage.getItem(KEY);if(s){data=JSON.parse(s);draw()}else{document.getElementById('emp').textContent='data.json не найден — используйте импорт'}});
function init(x){if(localStorage.getItem(KEY)){var o=JSON.parse(localStorage.getItem(KEY));if(o.length&&o[0]._ver===DATA_VER){data=o;fill();draw();return}}data=x;data.forEach(function(d,idx){d._ver=DATA_VER;if(d.id==null)d.id=Date.now()+idx});save();fill();draw()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function fillDates(){var sel=document.getElementById('fDate'),arr=[...new Set(data.map(function(d){var m=(d['Дата']||'').match(/(\d{2})\.(\d{4})/);return m?m[1]+'.'+m[2]:''}).filter(Boolean))].sort(function(a,b){return a.split('.').reverse().join('').localeCompare(b.split('.').reverse().join(''))});arr.forEach(function(dt){var o=document.createElement('option');o.value=dt;o.textContent=dt;sel.appendChild(o)})}
function fillLays(){var s=document.getElementById('fLay'),arr=[...new Set(data.map(function(d){return d['Закон / площадка']||'0'}).filter(function(v){return v!='0'}))].sort();arr.forEach(function(l){var o=document.createElement('option');o.value=l;o.textContent=l;s.appendChild(o)})}
function fill(){fillDates();fillLays();restoreFilters()}
function saveFilters(){try{localStorage.setItem(KEY+'_f',JSON.stringify({q:document.getElementById('q').value,dt:document.getElementById('fDate').value,la:document.getElementById('fLay').value,su:document.getElementById('fSub').value,sp:document.getElementById('fSus').value}))}catch(e){}}
function restoreFilters(){try{var o=JSON.parse(localStorage.getItem(KEY+'_f'));if(!o)return;document.getElementById('q').value=o.q||'';document.getElementById('fDate').value=o.dt||'';document.getElementById('fLay').value=o.la||'';document.getElementById('fSub').value=o.su||'';document.getElementById('fSus').value=o.sp||''}catch(e){}}
function render(){saveFilters();draw()}
function filt(){var q=(document.getElementById('q').value||'').toLowerCase(),dt=document.getElementById('fDate').value,la=document.getElementById('fLay').value,su=document.getElementById('fSub').value,sp=document.getElementById('fSus').value;return data.filter(function(d){if(q){var t=((d['Название']||'')+' '+(d['Заказчик']||'')+' '+(d['Ссылка']||'')).toLowerCase();if(t.indexOf(q)<0)return false}if(dt){var dm=(d['Дата']||'').match(/(\d{2})\.(\d{4})/);if(!dm||(dm[1]+'.'+dm[2])!==dt)return false}if(la&&d['Закон / площадка']!==la)return false;if(su&&(d['Подались да/нет (нет)']||'')!==su)return false;if(sp&&(d['Подозрительный да/нет (нет)']||'')!==sp)return false;return true})}
function dl(s){if(!s)return 999;var m=s.match(/(\d{2})\.(\d{2})\.(\d{4})/);if(!m)return 999;var d=new Date(+m[3],+m[2]-1,+m[1]);return Math.ceil((d-new Date())/86400000)}
function esc(s){var t=document.createElement('div');t.textContent=s;return t.innerHTML}
var COLS=[['Дата','Дата'],['Лид','№ лида'],['Ссылка','Ссылка'],['Название','Название'],['Заказчик','Заказчик'],['Регион','Регион'],['Площадка','Закон / площадка'],['Тип','Тип процедуры'],['Дедлайн','Дата завершения приема заявок'],['НМЦ','НМЦ'],['Обесп. заявки','Обеспечение заявки'],['Обесп. проц.','Обеспечение процедуры'],['Нач. ставка','Наша начальная ставка'],['Кон. ставка','Наша конечная ставка'],['% цены','% влияния цены решение'],['Подались','Подались да/нет (нет)'],['Подозр.','Подозрительный да/нет (нет)'],['Технологии','Основные технологии'],['Срок реал.','Срок реализации'],['Причина','Типы причины неучастия в тендере'],['Несоотв.','Описание причины несоответствия нас и тендера'],['Концепция','Делали концепцию или нет'],['Вопросы','Задавали вопросы или нет'],['Ответы','Получили ответы на вопросы или нет'],['Площадка-общ.','Общение только через площадку'],['Email/тел.','Общение по email / телефону'],['Оценка','Делалась ли оценка (командой / грубая)'],['Контакты','Контактные данные'],['Критерии %','Критерии влияния на решение с %'],['Коммент.','Комметарии'],['Итоги','Итоги (промежуточные и финальные)'],['','']];
function draw(){var r=filt();document.getElementById('stats').innerHTML='<div class="stat"><div class="n">'+data.length+'</div><div class="l">Всего</div></div><div class="stat"><div class="n">'+data.filter(function(d){return d['Подались да/нет (нет)']=='да'}).length+'</div><div class="l">Подались</div></div><div class="stat"><div class="n">'+data.filter(function(d){return d['Подозрительный да/нет (нет)']=='да'}).length+'</div><div class="l">Подозрительные</div></div>';document.getElementById('cnt').textContent='Показано: '+r.length+' из '+data.length;document.getElementById('emp').style.display=r.length?'none':'block';document.getElementById('tab').innerHTML='<tr>'+COLS.map(function(x,i){return '<th title="'+esc(x[1])+'" onclick="sort('+i+')">'+esc(x[0])+'</th>'}).join('')+'</tr>';r.forEach(function(d){var dlT=d['Дата завершения приема заявок']?d['Дата завершения приема заявок'].split(' ')[0]:'';var dc=(dl(dlT)>=0&&dl(dlT)<=3)?' class="soon"':'';var sb=(d['Подались да/нет (нет)']||'')=='да'?'<span class="tag green">да</span>':((d['Подались да/нет (нет)']||'')=='нет'?'<span class="tag red">нет</span>':'<span class="tag or">не ясно</span>');var sp=(d['Подозрительный да/нет (нет)']||'')=='да'?'<span class="tag red">да</span>':'<span class="tag gray">-</span>';var lk=(d['Ссылка']||'').indexOf('http')==0?' <a href="'+esc(d['Ссылка'])+'" target="_blank">link</a>':'';var nm=esc(d['Название']||'');document.getElementById('tab').insertAdjacentHTML('beforeend','<tr onclick="rowMenu(event,'+d.id+')"><td>'+esc(d['Дата']||'')+'</td><td>'+esc(d['№ лида']||'')+'</td><td>'+lk+'</td><td><div class="clamp4" title="'+nm+'"><b>'+nm+'</b></div></td><td>'+esc(d['Заказчик']||'')+'</td><td>'+esc(d['Регион']||'')+'</td><td>'+esc(d['Закон / площадка']||'')+'</td><td>'+esc(d['Тип процедуры']||'')+'</td><td'+dc+'>'+esc(dlT)+'</td><td>'+esc(d['НМЦ']||'')+'</td><td>'+esc(d['Обеспечение заявки']||'')+'</td><td>'+esc(d['Обеспечение процедуры']||'')+'</td><td>'+esc(d['Наша начальная ставка']||'')+'</td><td>'+esc(d['Наша конечная ставка']||'')+'</td><td>'+esc(d['% влияния цены решение']||'')+'</td><td>'+sb+'</td><td>'+sp+'</td><td>'+esc(d['Основные технологии']||'')+'</td><td>'+esc(d['Срок реализации']||'')+'</td><td>'+esc(d['Типы причины неучастия в тендере']||'')+'</td><td>'+esc(d['Описание причины несоответствия нас и тендера']||'')+'</td><td>'+esc(d['Делали концепцию или нет']||'')+'</td><td>'+esc(d['Задавали вопросы или нет']||'')+'</td><td>'+esc(d['Получили ответы на вопросы или нет']||'')+'</td><td>'+esc(d['Общение только через площадку']||'')+'</td><td>'+esc(d['Общение по email / телефону']||'')+'</td><td>'+esc(d['Делалась ли оценка (командой / грубая)']||'')+'</td><td>'+esc(d['Контактные данные']||'')+'</td><td>'+esc(d['Критерии влияния на решение с %']||'')+'</td><td>'+esc((d['Комметарии']||'').slice(0,60))+'</td><td>'+esc(d['Итоги (промежуточные и финальные)']||'')+'</td><td></td></tr>')})}
function sort(i){var k=['Дата','№ лида','Ссылка','Название','Заказчик','Регион','Закон / площадка','Тип процедуры','Дата завершения приема заявок','НМЦ','Обеспечение заявки','Обеспечение процедуры','Наша начальная ставка','Наша конечная ставка','% влияния цены решение','Подались да/нет (нет)','Подозрительный да/нет (нет)','Основные технологии','Срок реализации','Типы причины неучастия в тендере','Описание причины несоответствия нас и тендера','Делали концепцию или нет','Задавали вопросы или нет','Получили ответы на вопросы или нет','Общение только через площадку','Общение по email / телефону','Делалась ли оценка (командой / грубая)','Контактные данные','Критерии влияния на решение с %','Комметарии','Итоги (промежуточные и финальные)'][i];data.sort(function(a,b){return String(a[k]||'').localeCompare(String(b[k]||''),'ru')});save();draw()}
/* Контекстное меню у курсора */
function rowMenu(e,id){e.preventDefault();ctxId=id;var m=document.getElementById('ctx');m.style.display='block';var x=e.clientX,y=e.clientY;var mw=m.offsetWidth,mh=m.offsetHeight;if(x+mw>window.innerWidth)x-=mw;if(y+mh>window.innerHeight)y-=mh;m.style.left=x+'px';m.style.top=y+'px'}
function ctxEdit(){document.getElementById('ctx').style.display='none';if(ctxId!=null)edit(ctxId)}
function ctxDel(){document.getElementById('ctx').style.display='none';if(ctxId!=null)del(ctxId)}
document.addEventListener('click',function(e){if(!e.target.closest('#ctx')&&!e.target.closest('#tab tr'))document.getElementById('ctx').style.display='none'});
window.addEventListener('scroll',function(){document.getElementById('toTop').style.display=window.scrollY>300?'block':'none'});
function del(id){if(!confirm('Удалить?'))return;data=data.filter(function(d){return d.id!==id});save();draw()}
function tgl(){document.getElementById('form').classList.toggle('open');if(!document.getElementById('form').classList.contains('open')){editId=null;document.getElementById('btnAdd').style.display='';document.getElementById('btnUpd').style.display='none'}}
function g(id){return document.getElementById(id).value.trim()}
function sel(id){return document.getElementById(id).value}
function toDl(v){if(!v)return '';var p=v.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function toDate(v){if(!v)return '';var m=v.match(/(\d{2})\.(\d{2})\.(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:''}
function setDateLabel(){document.getElementById('nDateLbl').value=g('nDate')?toDl(g('nDate')):''}
function collect(){var o={};FIELDS.forEach(function(f){var id=F2I[f];var v;if(f=='Дата завершения приема заявок'){v=toDl(g(id))}else if(SEL_FIELDS.indexOf(f)>=0){v=sel(id)}else{v=g(id)}if(v)o[f]=v});if(g('nDate'))o['Дата']=toDl(g('nDate'));return o}
function add(){if(!g('nName')){alert('Укажите название');return}var o=collect();o.id=Date.now();if(!o['Дата'])o['Дата']=(function(){var d=new Date();return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()})();data.unshift(o);save();draw();tgl();clearForm()}
function edit(id){var d=data.find(function(x){return x.id===id});if(!d)return;editId=id;document.getElementById('form').classList.add('open');document.getElementById('btnAdd').style.display='none';document.getElementById('btnUpd').style.display='';FIELDS.forEach(function(f){var el=document.getElementById(F2I[f]);if(el.tagName=='SELECT'){el.value=d[f]||''}else if(f=='Дата завершения приема заявок'){el.value=toDate(d[f]||'')}else{el.value=d[f]||''}});document.getElementById('nDate').value=toDate(d['Дата']||'');setDateLabel();scrollTo(0,0)}
function upd(){if(!editId)return;var o=collect();var idx=data.findIndex(function(x){return x.id===editId});if(idx<0)return;for(var k in o){data[idx][k]=o[k]}save();draw();tgl();clearForm();editId=null;document.getElementById('btnAdd').style.display='';document.getElementById('btnUpd').style.display='none'}
function clearForm(){['nLead','nName','nCust','nReg','nLaw','nType','nDl','nNmt','nSecBid','nSecContr','nStartBid','nFinalBid','nPricePercent','nTech','nTerm','nReasonType','nReasonDesc','nContact','nCriteria','nHref','nComm','nHist','nDate','nDateLbl'].forEach(function(i){document.getElementById(i).value=''});['nSub','nSus','nConcept','nQAsked','nQAns','nOnlyPlatform','nEmailPhone','nEval'].forEach(function(i){document.getElementById(i).value=''})}
function exp(){var b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tenders.json';a.click()}
function imp(e){var f=e.target.files[0],fr=new FileReader();fr.onload=function(){try{var x=JSON.parse(fr.result);if(!Array.isArray(x))throw 0;data=x;save();location.reload()}catch(err){alert('Ошибка импорта')}};fr.readAsText(f,'utf-8')}
</script>
